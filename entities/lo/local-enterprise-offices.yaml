  summary: There are 31 Local Enterprise Offices located in Ireland, each providing support for small businesses, including business start-up grants available to micro enterprises within the first 18 months of start-up.
  description: Local Enterprise Offices deliver local enterprise development supports, including start-up grants to Irish microenterprises.
