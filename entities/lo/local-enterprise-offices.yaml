programs:
  - program_id: prg_01m485sfe7p067sjtaa7z50d22
    program_slug: priming-grant
    program_slug_aliases: []
    title: Priming Grant
    summary: A business start-up grant for micro enterprises within their first 18 months of start-up, covering capital, salary, consultancy, innovation, marketing and general overhead costs.
    source_ids:
      - src_3070b9610ba96aa0357fe6653c223920c6f7a3e613244d653b87c4f9953b072b
offers:
  - offer_id: off_01m485sfe7gbrvgz9315r7cyfd
    program_id: prg_01m485sfe7p067sjtaa7z50d22
    offer_slug: priming-grant
    offer_slug_aliases: []
    title: Priming Grant for new microenterprises
    summary: Eligible micro enterprises within their first 18 months of start-up may be awarded a Priming Grant of up to 50% of the investment or EUR 150,000, whichever is the lesser.
    description: The maximum Priming Grant payable shall be 50% of the investment or EUR 150,000, whichever is the lesser. In all other cases, the maximum grant shall be 50% of the investment or EUR 80,000, whichever is the lesser. All grants of a value greater than or equal to EUR 50,000, or with a cumulative value of EUR 100,000 over three years, require Enterprise Ireland approval. Subject to the 50% limit, a maximum grant of EUR 15,000 per full-time job created shall apply in respect of any employment support granted. Expenditure may be considered under the headings of capital items, salary costs, consultancy/innovation/marketing costs, and general overhead costs.
    lifecycle:
      status: active
      effective_from: 2026-10-06T00:00:00.000Z
    economics:
      benefits:
        - benefit_id: ben_01
          description: >-
            The maximum Priming Grant payable is 50% of the investment or EUR
            150,000, whichever is the lesser; in all other cases the maximum
            grant is 50% of the investment or EUR 80,000, whichever is the
            lesser (subject to Enterprise Ireland approval for grants of EUR
            50,000 or more, or cumulative EUR 100,000 over three years).
          kind: cashback
          value:
            kind: money
            value:
              kind: up-to
              amount:
                currency: EUR
                minor_units: 15000000
      consideration:
        kind: variable
        description: >-
          The applicant co-funds the balance of the eligible investment, so the
          maximum grant payable is 50% of the investment or EUR 150,000,
          whichever is the lesser.
    eligibility:
      rule:
        kind: all
        rules:
          - criterion_id: cri_01
            kind: manual
            reason: vendor-discretion
            statement: Eligible clients may be awarded a Priming Grant within the first eighteen months of setting up the business.
          - criterion_id: cri_02
            kind: manual
            reason: external-verification
            statement: The enterprise must not employ more than 10 people; in some cases, depending on certain criteria, businesses with 10 employees or more may be eligible, subject to your Local Enterprise Office advisor confirming eligibility.
          - criterion_id: cri_03
            kind: manual
            reason: external-verification
            statement: The enterprise must be established, registered and operate within the geographic location of the Local Enterprise Office.
          - criterion_id: cri_04
            kind: manual
            reason: external-verification
            statement: The enterprise must operate in the commercial sphere.
          - criterion_id: cri_05
            kind: manual
            reason: external-verification
            statement: The enterprise must demonstrate a market for the product/service.
          - criterion_id: cri_06
            kind: manual
            reason: external-verification
            statement: The enterprise must have potential for growth in domestic and/or export markets and also potential for new job creation.
    roles:
      terms_authority_entity_id: ent_01m485sfe2fh78f9x282k29e7b
      access_operator_entity_id: ent_01m485sfe2fh78f9x282k29e7b
    access:
